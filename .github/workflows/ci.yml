name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Keep macOS coverage on the Intel pool while hosted ARM64 capacity is constrained.
        os: [ubuntu-latest, windows-latest, macos-26-intel]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Run offline tests
        run: npm test
      - name: Check native Windows token storage
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="Windows DPAPI round trip" test/auth/token-backends.test.ts
        env:
          BB_TEST_NATIVE_TOKEN_STORE: "1"
      - name: Check installable package
        run: npm run test:package
      - name: Check installation from Git
        run: npm exec --yes --package=npm@12.2.1 -- npm run test:git

  package:
    name: Build installable package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Create package directory
        run: mkdir -p out
      - name: Build and pack CLI
        if: "github.event_name != 'push' || !startsWith(github.ref, 'refs/tags/')"
        run: npm pack --pack-destination out --json
      - name: Prepare and validate tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: npm run release:prepare -- "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - name: Upload installable package
        uses: actions/upload-artifact@v7
        with:
          name: bb-package-${{ github.sha }}
          path: out/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  release:
    name: Publish tagged release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - name: Download validated release assets
        uses: actions/download-artifact@v8
        with:
          name: bb-package-${{ github.sha }}
          path: out
      - name: Verify asset checksum
        working-directory: out/release
        run: sha256sum --check SHA256SUMS
      - name: Create GitHub release
        run: >-
          gh release create "$RELEASE_TAG"
          out/release/*.tgz out/release/SHA256SUMS out/release/release-notes.md
          --repo "$GH_REPO" --verify-tag --title "$RELEASE_TAG"
          --notes-file out/release/release-notes.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
