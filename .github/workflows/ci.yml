name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Node 24 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Check formatting
        run: npm run format:check
      - name: Check types
        run: npm run typecheck
      - name: Run offline tests
        run: npm test
      - name: Check native Windows token storage
        if: runner.os == 'Windows'
        run: node --test --test-name-pattern="Windows DPAPI round trip" test/auth/token-backends.test.ts
        env:
          BB_TEST_NATIVE_TOKEN_STORE: "1"
      - name: Check installable package
        run: npm run test:package
      - name: Check installation from Git
        run: npm exec --yes --package=npm@12.2.1 -- npm run test:git

  package:
    name: Build installable package
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Create package directory
        run: mkdir -p out
      - name: Build and pack CLI
        run: npm pack --pack-destination out --json
      - name: Upload installable package
        uses: actions/upload-artifact@v7
        with:
          name: bb-package-${{ github.sha }}
          path: out/*.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
